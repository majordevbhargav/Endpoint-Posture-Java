services:
  postgres:
    image: postgres:16
    container_name: ep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: endpoint_posture
      POSTGRES_USER: ep_app
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5434:5432"   # off 5432/5433 in case either is already taken on your machine
    volumes:
      - ep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ep_app -d endpoint_posture"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: ep-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # Optional: `docker compose up -d --build frontend`. The backend runs on the
  # Windows host (it needs PowerShell, CIM/DCOM and DPAPI), so the frontend
  # reaches it through host.docker.internal.
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://host.docker.internal:8090
    container_name: ep-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ep_pg_data: