name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Backend build + test ──────────────────────────────────────────────────
  backend:
    name: Backend — Maven build & test
    # Pinned so a future ubuntu-latest migration doesn't surprise us.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: endpoint_posture
          POSTGRES_USER: ep_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ep_app -d endpoint_posture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test (backend/)
        working-directory: backend
        env:
          DB_USERNAME: ep_app
          DB_PASSWORD: ci_test_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/endpoint_posture
          JWT_SECRET: ci-test-jwt-secret-at-least-256-bits-long-placeholder-value
          SEED_ADMIN_PASSWORD: ci-test-admin-password
          POSTURE_API_KEY: ci-test-agent-key
        run: mvn -B clean verify -Duser.timezone=UTC

  # ─── Frontend type-check, test, build ──────────────────────────────────────
  frontend:
    name: Frontend — TypeScript type-check, test & build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ─── Frontend image: main branch only, after BOTH test jobs pass ───────────
  docker-frontend:
    name: Build & push frontend Docker image
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # GHCR rejects any uppercase character in the image name.
      # GITHUB_REPOSITORY is "Owner/Repo-Name"; ${VAR,,} lowercases it in bash.
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max