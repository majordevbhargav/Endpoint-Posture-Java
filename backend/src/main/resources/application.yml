spring:
  application:
    name: endpoint-posture-java

  datasource:
    # Port 5434 maps to host port in docker-compose (5434:5432).
    # tcpKeepAlive makes the OS notice a dead socket instead of handing a
    # half-open connection to a worker (S12).
    url: ${DB_URL:jdbc:postgresql://localhost:5434/endpoint_posture?tcpKeepAlive=true}
    username: ${DB_USERNAME:ep_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 15000   # fail in 15 s, not 52 s, so a stall is visible quickly
      keepalive-time: 120000      # ping idle connections every 2 min
      idle-timeout: 300000        # must stay below max-lifetime
      max-lifetime: 900000        # retire connections after 15 min, before anything upstream does

  # S12: this is the REAL key for the @Scheduled thread pool. The old
  # app.task.scheduling.pool.size was ignored, so every scheduled task (ISE
  # watcher, recheck sweep, rollup, stale sweep) ran on one thread.
  task:
    scheduling:
      pool:
        size: 4

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8090}

logging:
  level:
    org.springframework.security: INFO
    com.endpointposture.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480

  seed-admin:
    username: ${SEED_ADMIN_USER:admin}
    password: ${SEED_ADMIN_PASSWORD}

  security:
    login:
      max-attempts: 5
      lock-minutes: 5

  api:
    # S12: /posture/latest and /hardware-health/latest (whole fleet) refuse to run
    # above this many endpoints; use /latest/batch and /hardware-health/page instead.
    fleet-list-max-endpoints: 2000

  jobs:
    poll-interval-ms: 3000
    worker-threads: 4
    reconnect-min-gap-minutes: 60 # 0 disables the reconnect gap
    workers:
      enabled: true
    stale-sweep-interval-ms: 60000
    stale-margin-seconds: 60
    recheck:
      enabled: true
      posture-hours: 4
      hardware-hours: 24
      failure-backoff-hours: 6
      sweep-interval-ms: 300000
      # S12: most jobs one sweep may queue PER JOB TYPE (oldest-checked first).
      # 500 per 5 min = 6,000/h per type, above the steady-state need at 20k devices.
      max-per-sweep: 500

  ise:
    base-url: ${ISE_BASE_URL:}
    username: ${ISE_USERNAME:}
    password: ${ISE_PASSWORD:}
    verify-tls: false
    session-poll-interval-ms: 15000
    disconnect-grace-polls: 2
    # S12: last_seen_at is rewritten for a still-connected device only when older than this.
    touch-min-minutes: 5
    enforcement-mode: ATTRIBUTE
    anc-policy-name: Quarantine

  posture:
    script-path: ../scripts/posture_agent.ps1
    server-url: http://localhost:8090/api/v1/posture
    api-key: ${POSTURE_API_KEY}
    cim-timeout-seconds: 30
    server-timeout-seconds: 15
    process-timeout-seconds: 60

  hardware:
    script-path: ../scripts/hardware_health_agent.ps1
    server-base-url: http://localhost:8090
    cim-timeout-seconds: 30
    submit-timeout-seconds: 20
    process-timeout-seconds: 70

  diagnostics:
    script-path: ../scripts/diagnostic_agent.ps1
    server-base-url: http://localhost:8090
    winrm-open-timeout-seconds: 20
    winrm-operation-timeout-seconds: 70
    submit-timeout-seconds: 20
    process-timeout-seconds: 130
    dns-test-name: www.microsoft.com
    internet-target: 8.8.8.8

  security-indicators:
    script-path: ../scripts/security_indicator_agent.ps1
    server-base-url: http://localhost:8090
    winrm-open-timeout-seconds: 20
    winrm-operation-timeout-seconds: 100
    submit-timeout-seconds: 20
    sample-count: 12
    sample-interval-seconds: 5
    process-timeout-seconds: 170

  retention:
    enabled: true
    inventory-keep-runs: 10
    inventory-cron: "0 30 3 * * *"
    job-days: 30
    jobs-cron: "0 45 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}