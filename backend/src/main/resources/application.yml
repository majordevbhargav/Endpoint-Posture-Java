spring:
  application:
    name: endpoint-posture-java
  jackson:
    deserialization:
      accept-single-value-as-array: true

  datasource:
    # Port 5434 is the host side of the docker-compose mapping (5434:5432).
    url: jdbc:postgresql://localhost:5434/endpoint_posture
    username: ${DB_USERNAME:ep_app}
    password: ${DB_PASSWORD:devpassword123}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate must never auto-generate it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8090

logging:
  level:
    org.springframework.security: INFO
    com.endpointposture.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET}                    # no default: startup fails if unset (dev profile supplies one)
    expiration-minutes: 480

  seed-admin:
    username: ${SEED_ADMIN_USER:admin}
    password: ${SEED_ADMIN_PASSWORD}         # no default

  jobs:
    poll-interval-ms: 3000          # idle sleep when the queue is empty
    worker-threads: 4               # each running job starts a powershell.exe: size to the host
    stale-sweep-interval-ms: 60000  # how often stuck RUNNING jobs are looked for
    stale-margin-seconds: 60        # added on top of the largest agent process timeout
    recheck:
      enabled: true
      posture-hours: 4              # re-run posture for connected endpoints older than this
      hardware-hours: 24            # re-run hardware health for connected endpoints older than this
      failure-backoff-hours: 6      # after a FAILED job, wait this long before auto-retrying
      sweep-interval-ms: 300000     # how often the recheck sweep runs (5 min)

  ise:
    base-url: ${ISE_BASE_URL:}               # blank = ISE features safely disabled
    username: ${ISE_USERNAME:}
    password: ${ISE_PASSWORD:}
    verify-tls: false
    session-poll-interval-ms: 15000
    disconnect-grace-polls: 2                # missed polls in a row before marking disconnected
    enforcement-mode: ATTRIBUTE
    anc-policy-name: Quarantine

  posture:
    script-path: ../scripts/posture_agent.ps1
    server-url: http://localhost:8090/api/v1/posture
    api-key: ${POSTURE_API_KEY}              # no default
    cim-timeout-seconds: 30
    server-timeout-seconds: 15
    process-timeout-seconds: 60

  hardware:
    script-path: ../scripts/hardware_health_agent.ps1
    server-base-url: http://localhost:8090
    cim-timeout-seconds: 30
    submit-timeout-seconds: 20
    process-timeout-seconds: 70